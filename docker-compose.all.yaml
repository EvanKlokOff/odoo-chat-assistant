version: '3.8'

services:
  # БД для чат-анализатора
  chat_analyzer_postgres:
    image: pgvector/pgvector:pg16
    container_name: chat_analyzer_db
    environment:
      - POSTGRES_DB=chat_analyzer
      - POSTGRES_USER=analyzer
      - POSTGRES_PASSWORD=secure_password
    ports:
      - "5432:5432"
    volumes:
      - chat_analyzer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U analyzer -d chat_analyzer" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal_network

  # Redis для чат-анализатора
  chat_analyzer_redis:
    image: redis:7-alpine
    container_name: chat-analyzer-redis_db
    ports:
      - "6379:6379"
    volumes:
      - chat_analyzer_redis_data:/data
      - ./redis_db.conf:/usr/local/etc/redis_db/redis_db.conf:ro
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal_network

  # БД для Odoo
  odoo_postgres:
    image: postgres:16
    container_name: odoo_postgres
    environment:
      - POSTGRES_DB=odoo_db  # Жестко задаём для простоты
      - POSTGRES_USER=odoo    # Жестко задаём пользователя odoo
      - POSTGRES_PASSWORD=odoo_secure_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo_postgres_data:/var/lib/postgresql/data
      - ./postgres-init-odoo:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U odoo -d odoo_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Odoo сервер
  odoo:
    image: odoo:18
    container_name: odoo_app
    depends_on:
      odoo_postgres:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_LONGPOLL_PORT:-8072}:8072"
    environment:
      - DB_HOST=odoo_postgres  # ИСПРАВЛЕНО: правильное имя хоста
      - DB_PORT=5432
      - DB_USER=odoo
      - DB_PASSWORD=odoo_secure_password
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf
    command: odoo -i base --without-demo=all
    restart: unless-stopped
    networks:
      - internal_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== ML МОДЕЛИ (Ollama) - ОПТИМИЗАЦИИ ДЛЯ M1/M2/M3 ==========

  # FastAPI сервер
  chat_api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: chat_api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql+asyncpg://analyzer:secure_password@chat_analyzer_postgres:5432/chat_analyzer
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_KEYS=odoo_api_key_1
      - ADMIN_API_KEY=your_admin_api_key
      - REDIS_URL=redis://:secure_redis_password@chat_analyzer_redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_LLM_MODEL=phi4-mini:latest
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - LLM_PROVIDER=ollama
      - EMBEDDING_PROVIDER=nomic
      - DEBUG=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chat_analyzer_postgres:
        condition: service_healthy
      chat_analyzer_redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - internal_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Worker для тяжелых LLM задач (анализ) - ограниченная конкурентность
  celery_analysis_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: celery_analysis_worker
    command: worker-analysis
    env_file:
      - .env.docker
    environment:
      - REDIS_URL=redis://:secure_redis_password@chat_analyzer_redis:6379/0
      - CELERY_BROKER_URL=redis://:secure_redis_password@chat_analyzer_redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://analyzer:secure_password@chat_analyzer_postgres:5432/chat_analyzer
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_LLM_MODEL=phi4-mini:latest
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - LLM_PROVIDER=ollama
      - EMBEDDING_PROVIDER=nomic
      - PYTHONPATH=/app
      - DEBUG=false
      - TASK_MONITOR_INTERVAL=10.0
      - ANALYSIS_CONCURRENCY=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chat_analyzer_redis:
        condition: service_healthy
      chat_analyzer_postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./models_cache:/app/models_cache
    networks:
      - internal_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_embeddings_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: celery_embeddings_worker
    command: worker-embeddings
    env_file:
      - .env.docker
    environment:
      - REDIS_URL=redis://:secure_redis_password@chat_analyzer_redis:6379/0
      - CELERY_BROKER_URL=redis://:secure_redis_password@chat_analyzer_redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://analyzer:secure_password@chat_analyzer_postgres:5432/chat_analyzer
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_PROVIDER=nomic
      - PYTHONPATH=/app
      - DEBUG=false
      - EMBEDDINGS_CONCURRENCY=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chat_analyzer_redis:
        condition: service_healthy
      chat_analyzer_postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./models_cache:/app/models_cache
    networks:
      - internal_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_fast_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: celery_fast_worker
    command: worker-fast
    env_file:
      - .env.docker
    environment:
      - REDIS_URL=redis://:secure_redis_password@chat_analyzer_redis:6379/0
      - CELERY_BROKER_URL=redis://:secure_redis_password@chat_analyzer_redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://analyzer:secure_password@chat_analyzer_postgres:5432/chat_analyzer
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONPATH=/app
      - DEBUG=false
      - FAST_CONCURRENCY=10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chat_analyzer_redis:
        condition: service_healthy
      chat_analyzer_postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - internal_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: celery_beat
    command: beat
    env_file:
      - .env.docker
    environment:
      - REDIS_URL=redis://:secure_redis_password@chat_analyzer_redis:6379/0
      - CELERY_BROKER_URL=redis://:secure_redis_password@chat_analyzer_redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://analyzer:secure_password@chat_analyzer_postgres:5432/chat_analyzer
      - PYTHONPATH=/app
      - REDBEAT_LOCK_TIMEOUT=120
      - REDBEAT_LOCK_RENEWAL=30
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chat_analyzer_redis:
        condition: service_healthy
      chat_analyzer_postgres:
        condition: service_healthy
    networks:
      - internal_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal_network:
    driver: bridge

volumes:
  chat_analyzer_postgres_data:
    driver: local
  chat_analyzer_redis_data:
    driver: local
  odoo_postgres_data:
    driver: local
  odoo_data:
    driver: local